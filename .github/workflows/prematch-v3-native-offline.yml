name: BETPILOT PREMATCH | Original five-engine offline validation
on:
  push:
    branches: ['recovery/**']
    paths: ['betpilot_v3/**', 'betpilot/**', 'vendor/**', 'bookmaker_independent/**', '.github/workflows/prematch-v3-native-offline.yml', 'requirements.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-five-engines:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NUMBA_NUM_THREADS: '4'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical and test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Ensure original frozen engine hashes and run five test suites
        run: python betpilot_v3/run_replay.py --test
      - name: Full native synthetic handoff using all five original engines
        run: python betpilot_v3/run_replay.py --output-dir output/native_synthetic
      - name: Verify exactly what has been tested
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/native_synthetic/INTEGRATION_AUDIT.json')
          assert p.exists(), 'No five-engine native integration audit produced'
          j=json.loads(p.read_text('utf8'))
          print('FULL_NATIVE_SYNTHETIC_AUDIT_EXISTS', j.get('schema'))
          print('This is NOT a real Deportivo-Osasuna betting prediction.')
          PY
      - name: Execute the exact Deportivo - Osasuna command without secrets; verify NO fabricated outcome
        run: |
          set +e
          env -u PITCHAPI_API_KEY -u APISPORTS_KEY python -m betpilot_v3.command "BETPILOT: Deportivo La Coruña - Osasuna" --output-dir output/acceptance_deportivo > /dev/null
          rc=$?
          set -e
          test "$rc" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('output/acceptance_deportivo/BETPILOT_STATUS.json').read_text('utf8'))
          assert p['status']=='AUTHENTICATION_ERROR', p
          assert p['reason_code']=='MISSING_PROVIDER_CREDENTIALS', p
          assert not p['real_fixture_analysis_confirmed'], p
          assert not p['five_engines_verified'], p
          assert p.get('decision') is None, p
          print('DEPORTIVO_COMMAND_EXECUTED: FAIL_CLOSED_NO_REAL_DATA')
          PY
      - name: Archive synthetic evidence (no private fixtures or credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-engines-original-offline-evidence
          path: output/native_synthetic/
          if-no-files-found: warn
          retention-days: 7
